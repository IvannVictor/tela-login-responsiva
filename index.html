<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/css/style.css">

    <title>Tela de Login</title>
</head>
<body>

    <div class="main-login">

        <div class="left-login">
            <h1>Faça login<br>E entre para nosso time</h1>
            <img src="src/img/tela-login.svg" class="left-login-image" alt="tela-login">
        </div>


        <div class="right-login">

            <div class="card-login">
                <h1>LOGIN</h1>

                <div class="textfield">
                    <label for="usuario">Usuário</label>
                    <input id="usuario" type="text" name="usuario" placeholder="Usuário" autocomplete="username">
                </div>


                <div class="textfield">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" name="senha" placeholder="Senha" autocomplete="current-password">
                </div>

                <button class="btn-login" type="button" title="Demonstração visual: não autentica usuários">Login</button>

            </div>

        </div>

    </div>

</body>
</html>
